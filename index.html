<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Race Tracker – Maidstone Half</title>
<meta name="theme-color" content="#14181f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  --bg:#ffffff;--bg2:#f2f4f7;--bg3:#e4e8ee;--fg:#0b0d10;--fg2:#3d4652;--line:#c9d0da;
  --accent:#0b57d0;--danger:#b3261e;--ok:#146c2e;--warn:#8a5a00;--route:#1d2433;--routecase:#ffffff;
  --me:#1a73e8;--chip:#ffffff;--shadow:0 1px 3px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b;--bg2:#1a2029;--bg3:#262e3a;--fg:#f4f6f9;--fg2:#b8c2cf;--line:#38424f;
    --accent:#8ab4f8;--danger:#ff8a80;--ok:#7ee2a0;--warn:#ffcc66;--route:#1d2433;--routecase:#ffffff;
    --me:#4f9bff;--chip:#1a2029;--shadow:0 1px 3px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#11151b;--bg2:#1a2029;--bg3:#262e3a;--fg:#f4f6f9;--fg2:#b8c2cf;--line:#38424f;
  --accent:#8ab4f8;--danger:#ff8a80;--ok:#7ee2a0;--warn:#ffcc66;--route:#1d2433;--routecase:#ffffff;
  --me:#4f9bff;--chip:#1a2029;--shadow:0 1px 3px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.num,time,.t{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);padding:0 14px;cursor:pointer;font-weight:600}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button.danger{border-color:var(--danger);color:var(--danger);background:transparent}
button.danger.armed{background:var(--danger);color:var(--bg)}
button.small{min-height:44px;padding:0 10px;font-size:14px}
button:disabled{opacity:.45}
input,select,textarea{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;max-width:100%}
textarea{padding:8px;width:100%;min-height:90px;font:13px/1.3 ui-monospace,monospace}
label{font-size:14px;color:var(--fg2);display:block;margin:6px 0 2px}
#strip{flex:0 0 auto;display:flex;gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.chip{cursor:pointer;flex:1 0 min(46vw,230px);min-width:0;display:flex;align-items:center;gap:8px;background:var(--chip);border:2px solid var(--c);border-radius:12px;padding:4px 10px 4px 4px;min-height:48px;max-width:88vw}
.chip .txt{display:flex;flex-direction:column;font-size:13px;line-height:1.2;white-space:nowrap;min-width:0}
.chip .txt span{overflow:hidden;text-overflow:ellipsis}
.chip b{font-size:14px}
.dot{width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:var(--c);color:var(--ct);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;border:2px solid #fff;box-shadow:var(--shadow)}
.emptychip{color:var(--fg2);font-size:14px;padding:12px 4px}
#mapwrap{position:relative;flex:0 0 auto;height:52dvh;transition:height .2s}
body.sheet-big #mapwrap{height:26dvh}
#map{position:absolute;inset:0;background:var(--bg3)}
#mapmsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--fg2)}
.mapbtns{position:absolute;right:8px;top:8px;z-index:500;display:flex;flex-direction:column;gap:8px}
.mapbtns button{width:48px;height:48px;padding:0;background:var(--bg);box-shadow:var(--shadow);font-size:20px}
#profile{flex:0 0 auto;height:76px;position:relative;background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);touch-action:none}
#profile canvas{width:100%;height:100%;display:block}
#profread{position:absolute;left:6px;top:2px;right:6px;font-size:12px;pointer-events:none;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;text-shadow:0 0 3px var(--bg2),0 0 3px var(--bg2)}
#sheet{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg)}
#tabs button{flex:1;border:0;border-radius:0;background:transparent;font-size:15px;border-bottom:3px solid transparent}
#tabs button.on{border-bottom-color:var(--accent);color:var(--accent)}
#tabs #grow{flex:0 0 52px}
.pane{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px calc(24px + env(safe-area-inset-bottom));display:none;-webkit-overflow-scrolling:touch}
.pane.on{display:block}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;margin:0 0 10px}
.card.hi{border:2px solid var(--accent)}
.card h3{margin:0 0 2px;font-size:17px}
.meta{font-size:13px;color:var(--fg2)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.rrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.rrow .dot{width:30px;height:30px;flex-basis:30px;font-size:14px}
.rrow .when{flex:1;min-width:0}
.rrow .when .big{font-size:18px;font-weight:700}
s{color:var(--fg2);font-weight:400}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--accent);color:var(--bg);margin:2px 4px 2px 0}
.badge.c{background:var(--c);color:var(--ct)}
.both{margin-top:6px;font-size:14px;font-weight:600;color:var(--ok)}
.bigbtn{width:100%;min-height:56px;font-size:18px;border:0;background:var(--c);color:var(--ct);margin:6px 0}
.bigbtn.ghost{background:transparent;color:var(--fg);border:2px solid var(--c)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 > *{min-width:0}
.grid2 input,.grid2 select{width:100%}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid transparent;background:var(--c);color:var(--ct);font-weight:800;padding:0}
.swatch.on{border-color:var(--fg)}
.warnbar{background:var(--warn);color:var(--bg);font-size:13px;padding:6px 10px;font-weight:600}
.note{font-size:14px;color:var(--fg2)}
.sightings{font-size:14px;margin:6px 0 0;padding:0;list-style:none}
.sightings li{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 0;border-top:1px dashed var(--line)}
details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:2000;background:var(--fg);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;display:none;align-items:center;gap:10px;max-width:calc(100vw - 32px);box-shadow:var(--shadow);font-size:15px}
#toast button{background:transparent;color:var(--bg);border-color:var(--bg)}
.leaflet-container{font:inherit}
.rdot{width:30px;height:30px;border-radius:50%;background:var(--c);color:var(--ct);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;box-shadow:0 0 0 2px rgba(0,0,0,.55)}
.rdot.fin{border-style:dashed}
.medot{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.mk{background:#fff;color:#111;border:2px solid var(--route);border-radius:10px;font-size:11px;font-weight:800;text-align:center;line-height:16px;min-width:20px;padding:0 3px;font-variant-numeric:tabular-nums}
.arrow{color:var(--route);font-size:16px;line-height:16px;text-align:center;text-shadow:0 0 2px #fff,0 0 2px #fff}
.poi{color:#111;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #111;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:var(--shadow)}
.poi.fav{border-color:#b8860b;border-width:3px}
.poi.hi{outline:3px solid var(--accent);outline-offset:1px}
.leaflet-tooltip.plab{font-size:12px;font-weight:700;padding:1px 5px}
.addform{border:2px dashed var(--accent)}
.hint{font-size:13px;color:var(--fg2);margin:4px 0}
h2{font-size:16px;margin:14px 0 6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.ex{border:2px dashed var(--warn)}
.exlabel{color:var(--warn);font-weight:700;font-size:13px}
</style>
</head>

<div id="storewarn" class="warnbar" hidden>Can't save on this phone (private mode or storage blocked). Everything still works, but it will be lost if you close the page.</div>

</div>
<div id="profile"><canvas id="pc"></canvas><div id="profread"></div></div>
<div id="sheet">

</div>
<div id="toast"><span id="toastmsg"></span><button id="toastbtn" class="small">Undo</button></div>

    case 'hide': state.hiddenPoints = [...new Set([...(state.hiddenPoints || []), b.dataset.id])]; state.shownPoints = (state.shownPoints || []).filter(x => x !== b.dataset.id); changed(); break;
    case 'unhide': state.hiddenPoints = (state.hiddenPoints || []).filter(x => x !== b.dataset.id); state.shownPoints = [...new Set([...(state.shownPoints || []), b.dataset.id])]; changed(); break;
    case 'delpt': arm(b, 'dp' + b.dataset.id, () => { state.points = state.points.filter(p => p.id !== b.dataset.id); changed(); }); break;
    case 'zoom': { const p = POINTS.find(x => x.id === b.dataset.id); if (map && p) { map.setView([p.lat, p.lon], 16); } break; }
    case 'addpt': { const nm = $('#newname').value.trim() || 'My spot'; state.points.push({ id: 'c' + uid(), name: nm, lat: pendingAdd.lat, lon: pendingAdd.lon }); pendingAdd = null; clearHi(); changed(); toast(`Added "${nm}"`); break; }
    case 'gochip': { const pos = runnerPos(r); if (pos.d == null) { toast(`${r.name} hasn't started yet. Start them in the Runners tab.`); break; }
      if (map) { map.setView(latLonAt(pos.d), Math.max(map.getZoom(), 15)); runnerMarkers[r.id] && runnerMarkers[r.id].openTooltip(); } break; }
    case 'canceladd': pendingAdd = null; clearHi(); renderPoints(); break;
    case 'gotorunners': showTab('runners'); setTimeout(() => $('#fname')?.focus(), 50); break;
    case 'share': copyText(shareText(), null); break;
    case 'export': { const t = JSON.stringify(state); copyText(t, $('#exportbox')); $('#exportbox').hidden = false; $('#exportbox').value = t; break; }
    case 'import': { try { const s = JSON.parse($('#importbox').value); if (!s || s.version !== 1 || !Array.isArray(s.runners)) throw 0;
        arm(b, 'imp', () => { state = Object.assign(defaultState(), s, { settings: Object.assign(defaultState().settings, s.settings || {}) }); save(); setupCourse(); afterCourseChange(); $('#impmsg').textContent = 'Imported.'; }, 'Replace current setup? Tap again'); }
      catch (err) { $('#impmsg').textContent = 'That doesn’t look like an exported setup.'; } break; }
    case 'resetrace': arm(b, 'rr', () => { state.runners.forEach(x => { x.start = null; x.sightings = []; }); changed(); toast('Race reset: starts and sightings cleared'); }, 'Clear starts & sightings? Tap again'); break;
    case 'clearall': arm(b, 'ca', () => { try { localStorage.removeItem(KEY); } catch (e) { } state = defaultState(); save(); setupCourse(); afterCourseChange(); toast('Everything cleared'); }, 'Wipe ALL data? Tap again'); break;
    case 'overpass': refreshOverpass(); break;
    case 'usebuiltin': arm(b, 'ub', () => { state.course = null; save(); setupCourse(); afterCourseChange(); }); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, s = state.settings;
  if (t.id === 'sUnits') { s.units = t.value; drawMarkers(); changed(); }
  else if (t.id === 'sTiles') { s.tiles = t.value; setTiles(); save(); }
  else if (t.id === 'sTheme') { s.theme = t.value; applyTheme(); save(); }
  else if (t.id === 'sFat') { s.fatigue = t.checked; changed(); }
  else if (t.id === 'sBlend') { s.blend = +t.value / 100; changed(); }
  else if (t.id === 'sStart') { if (t.value) { s.raceStart = t.value; changed(); } }
  else if (t.id === 'gpxfile' && t.files[0]) loadGpx(t.files[0]);
});
document.addEventListener('input', e => { if (e.target.id === 'sBlend') $('#blendv').textContent = e.target.value + '%'; });
function applyTheme() { const t = state.settings.theme; if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); drawProfile(); }
function shareText() {
  const lines = [`${C.name || 'Race'}: predicted passing times (±2–4 min)`];
  const rows = []; for (const p of POINTS) { if (!p.hidden) for (const d of p.passes) rows.push({ p, d }); } rows.sort((a, b) => a.d - b.d);
  for (const { p, d } of rows) { { const parts = state.runners.map(r => { const t = predAt(r, d).fc; return t > now() - 120000 ? `${r.name} ~${fmtClockMin(t)}` : null; }).filter(Boolean);
    if (parts.length) lines.push(`${p.name} (${fmtD(d)}): ${parts.join(', ')}`); } }
  return lines.join('\n');
}
function showTab(t) { document.querySelectorAll('#tabs button[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === t)); document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + t)); try { sessionStorage.setItem('tab', t); } catch (e) { } }
document.querySelectorAll('#tabs button[data-tab]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
$('#grow').addEventListener('click', () => { document.body.classList.toggle('sheet-big'); setTimeout(() => { map && map.invalidateSize(); drawProfile(); }, 250); });
$('#bFit').addEventListener('click', fitCourse);
$('#bMe').addEventListener('click', () => { if (me && map) map.setView([me.lat, me.lon], Math.max(map.getZoom(), 15)); else toast(geoErr || 'Waiting for GPS…'); });
$('#bLayer').addEventListener('click', () => { state.settings.tiles = state.settings.tiles === 'osm' ? 'topo' : 'osm'; setTiles(); save(); toast(state.settings.tiles === 'osm' ? 'OpenStreetMap' : 'OpenTopoMap (contours)'); });

/* ===================== Overpass refresh ===================== */
async function refreshOverpass() {
  const m = $('#opmsg'); m.textContent = 'Fetching…';
  let a = 90, b = 180, c = -90, d = -180; for (let i = 0; i < N; i++) { a = Math.min(a, C.lat[i]); c = Math.max(c, C.lat[i]); b = Math.min(b, C.lon[i]); d = Math.max(d, C.lon[i]); }
  const q = `[out:json][timeout:30];nwr["amenity"~"^(pub|bar|cafe)$"](${(a - .003).toFixed(4)},${(b - .004).toFixed(4)},${(c + .003).toFixed(4)},${(d + .004).toFixed(4)});out center tags;`;
  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'data=' + encodeURIComponent(q) });
    if (!res.ok) throw new Error('HTTP ' + res.status); const j = await res.json(); let added = 0;
    const known = POINTS.filter(p => !p.extra);
    const extras = [];
    for (const e of j.elements) { const la = e.lat ?? e.center?.lat, lo = e.lon ?? e.center?.lon; if (la == null || !e.tags?.name) continue;
      if (nearestNode(la, lo).off > 100) continue;
      if (known.some(p => hav(p.lat, p.lon, la, lo) < 60)) continue;
      extras.push({ id: 'osm' + e.type[0] + e.id, name: e.tags.name, type: e.tags.amenity === 'cafe' ? 'cafe' : 'pub', lat: +la.toFixed(5), lon: +lo.toFixed(5) }); }
    added = extras.filter(x => !(state.extraPois || []).some(y => y.id === x.id)).length;
    state.extraPois = extras; changed(); m.textContent = `Done: ${extras.length} extra near the route (${added} new). They're in “Hidden points” on the Points tab.`;
  } catch (err) { m.textContent = 'Couldn’t reach OpenStreetMap (' + err.message + '). The built-in list is still there.'; }
}

/* ===================== GPX loader ===================== */
async function loadGpx(file) {
  const msg = $('#gpxmsg'); msg.textContent = 'Reading…';
  try {
    const xml = new DOMParser().parseFromString(await file.text(), 'application/xml');
    let pts = [...xml.getElementsByTagName('trkpt')]; if (!pts.length) pts = [...xml.getElementsByTagName('rtept')];
    if (pts.length < 2) throw new Error('no track points found');
    const raw = pts.map(p => ({ lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon'), ele: p.getElementsByTagName('ele')[0] ? +p.getElementsByTagName('ele')[0].textContent : NaN }));
    const cum = [0]; for (let i = 1; i < raw.length; i++) cum.push(cum[i - 1] + hav(raw[i - 1].lat, raw[i - 1].lon, raw[i].lat, raw[i].lon));
    const len = cum[cum.length - 1], step = 25, n = Math.floor(len / step) + 2;
    const lat = [], lon = [], ele = []; let j = 0;
    for (let k = 0; k < n; k++) { const d = Math.min(k * step, len); while (j < cum.length - 2 && cum[j + 1] < d) j++; const f = (d - cum[j]) / ((cum[j + 1] - cum[j]) || 1);
      lat.push(raw[j].lat + f * (raw[j + 1].lat - raw[j].lat)); lon.push(raw[j].lon + f * (raw[j + 1].lon - raw[j].lon)); ele.push(raw[j].ele + f * (raw[j + 1].ele - raw[j].ele)); }
    const good = ele.filter(e => isFinite(e) && e > -50 && e < 5000).length / ele.length > 0.9;
    if (!good) { msg.textContent = 'No elevation in GPX: fetching from Open-Meteo…'; const every = 10, idx = []; for (let k = 0; k < n; k += every) idx.push(k); if (idx[idx.length - 1] !== n - 1) idx.push(n - 1);
      const got = {}; for (let s = 0; s < idx.length; s += 100) { const chunk = idx.slice(s, s + 100);
        const u = `https://api.open-meteo.com/v1/elevation?latitude=${chunk.map(k => lat[k].toFixed(5)).join(',')}&longitude=${chunk.map(k => lon[k].toFixed(5)).join(',')}`;
        const r = await fetch(u); if (!r.ok) throw new Error('elevation HTTP ' + r.status); const js = await r.json(); chunk.forEach((k, q) => got[k] = js.elevation[q]); }
      for (let q = 0; q < idx.length - 1; q++) { const a = idx[q], b = idx[q + 1]; for (let k = a; k <= b; k++) ele[k] = got[a] + (got[b] - got[a]) * (k - a) / ((b - a) || 1); } }
    const sm = ele.map((_, k) => { let s = 0, c = 0; for (let q = Math.max(0, k - 4); q <= Math.min(n - 1, k + 4); q++) { s += ele[q]; c++; } return s / c; });
    const Cf = i => 155.4 * i ** 5 - 30.4 * i ** 4 - 43.3 * i ** 3 + 46.3 * i ** 2 + 19.5 * i + 3.6; const a8 = Math.max(Cf(-.08) / 3.6, .9);
    const mf = i => { i = Math.max(-.25, Math.min(.25, i)); if (i >= 0) return Cf(i) / 3.6; if (i >= -.08) return Math.max(Cf(i) / 3.6, .9); if (i >= -.15) return a8 + (1 - a8) * (-.08 - i) / .07; return 1 + .4 * (-.15 - i); };
    const mult = []; let climb = 0; for (let k = 1; k < n; k++) { const dd = Math.min(k * step, len) - Math.min((k - 1) * step, len); const g = (sm[k] - sm[k - 1]) / (dd || 1); mult.push(+mf(g).toFixed(4)); climb += Math.max(0, sm[k] - sm[k - 1]); }
    state.course = { name: file.name.replace(/\.gpx$/i, ''), len, step, lat: lat.map(x => +x.toFixed(5)), lon: lon.map(x => +x.toFixed(5)), ele: sm.map(x => +x.toFixed(1)), mult, climb: Math.round(climb) };
    state.mapView = null; save(); setupCourse(); afterCourseChange(); msg.textContent = `Loaded ${(len / 1000).toFixed(2)} km.`;
  } catch (err) { msg.textContent = 'Couldn’t load that GPX: ' + err.message; }
}
function afterCourseChange() {
  if (map) { map.remove(); map = null; runnerMarkers = {}; meMarker = null; hiMarker = null; } initMap(); drawMe(); recompute(); buildPoints(); renderAll();
}

/* ===================== Main loop ===================== */
function renderAll(opts = {}) {
  buildPoints(); computeReach(); renderStrip(); renderPoints(); renderRunners(); renderSettings(); drawPois(); drawRunners(); drawProfile();
}
let lastListRender = 0;
function tick() {
  renderStrip(); drawRunners(); drawProfile(); renderSettingsStatus();
  const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest('#sheet') && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (!focused && now() - lastListRender > 20000) { lastListRender = now(); if (!pendingAdd) renderPoints(); drawPois(); if (!editing && !$('#p-runners details[open]') && ![...document.querySelectorAll('#p-runners input')].some(i => i.value)) renderRunners(); }
}
function boot() {
  if (!storageOK) $('#storewarn').hidden = false;
  setupCourse(); recompute(); buildPoints(); applyTheme();
  initMap(); drawMe(); renderAll();
  try { const t = sessionStorage.getItem('tab'); if (t) showTab(t); else if (!state.runners.length) showTab('runners'); } catch (e) { if (!state.runners.length) showTab('runners'); }
  startGeo(); requestWake();
  setInterval(tick, 5000);
  window.addEventListener('resize', () => { drawProfile(); map && map.invalidateSize(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
}
boot();
